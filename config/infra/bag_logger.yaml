# Drop into your deployment as config/infra/ros2-bag-logger.yaml and add it to vehicle.yaml `infra:` with
# an order just ABOVE the zenoh router (e.g. order 1, router at 0) so the logger is recording before the
# sensors come up. Records the ROS 2 telemetry graph to ${RIG_DATA_DIR}/current/bags/<name>/<name>_<UTCstamp>
# (the OPEN run — flat bags/<name> when no run registry exists);
# the heavy image topics are excluded by default (camera-service records compressed video at the source).
service: ros2-bag-logger
name: bag_logger           # bag dir name; also the recorder node name (control.node_name overrides)

record:
  mode: exclude            # all | allow | exclude — topics only; services/actions are the keys below
  topics: []               # allow: exact topic names to record; exclude: regex patterns to drop
  exclude_images: true     # also drop image topics (default true)
  # exclude_images_regex: '.*/image_raw(/.*)?$'   # the default; widen for image_color/_rect if needed
  # include_hidden_topics: true       # also record ROS-internal (hidden) topics
  # include_unpublished_topics: true  # also subscribe to discovered topics that have no publisher yet
  # services: all                     # record service calls: all | [/exact/service, ...] — captured via
  #                                   # service EVENT topics, so only servers with introspection ON appear
  # actions: all                      # record action activity: all | [/exact/action, ...]
  repeat_transient_local: true      # re-write latched topics (/tf_static, maps) into every split /
  #                                   # snapshot file: true = last msg per topic, N = depth, ['/tf_static=1', ...]

output:
  subdir: bags             # -> <run>/bags/<name>/... (flat bags/<name> without a registry)
  storage: mcap            # mcap (one file, recommended; needs the rosbag2 mcap storage plugin) | sqlite3
  # storage_preset: zstd_fast   # mcap chunk compression INSIDE a standard .mcap (every tool reads it
  #                             # as-is). Default zstd_fast; zstd_small = best ratio (more CPU),
  #                             # fastwrite = no chunking/CRC (max throughput), none = uncompressed.
  compression: none        # rosbag2-LAYER compression (file:zstd | message:zstd) — meant for sqlite3.
  #                          Leave none for mcap: the storage_preset above already compresses in-band;
  #                          file:zstd would double-compress and emit .mcap.zstd files that mcap tools
  #                          can't read without decompressing first.
  split_duration_s: 600    # roll to a new file every N seconds (0 = no time split)
  max_size_mb: 0           # also roll at N MB (0 = no size split)
  # max_files: 0             # circular logging: keep only the newest N split files, delete the oldest
  #                          # (disk-capped vehicles; requires a time or size split above)
  # max_cache_mb: 512        # recorder write cache in RAM (rosbag2 default 100). Size to ~5 s of
  #                          # expected ingest: vehicle storage stalls for 100s of ms under zstd
  #                          # flushes, and 100 MB is ~1 s at expanded-pointcloud rates. A crash or
  #                          # power cut loses up to the cache contents (splits bound the window);
  #                          # in snapshot mode this IS the ring buffer .../snapshot flushes to disk

# Runtime control (triggered logging): the recorder is a normal ROS 2 node with a PINNED name (default:
# `name`, sanitized), so rosbag2's own control services sit at stable paths:
#   /bag_logger/{pause,resume,is_paused,split_bagfile,stop,record}  (+ /bag_logger/snapshot if snapshot: true)
# Gate recording from OUTSIDE — a trigger node (arm/disarm, geofence, mission state) or by hand:
#   ros2 service call /bag_logger/pause         rosbag2_interfaces/srv/Pause
#   ros2 service call /bag_logger/split_bagfile rosbag2_interfaces/srv/SplitBagfile  # split, then resume,
#   ros2 service call /bag_logger/resume        rosbag2_interfaces/srv/Resume        # -> session-aligned files
# control:
#   node_name: bag_logger  # override the service-path prefix above
#   start_paused: true     # up + subscribed from boot but write nothing until .../resume (fail-paused;
#                          # the default false = record unless told otherwise, fail-recording)
#   snapshot: true         # keep only the last max_cache_mb of messages in RAM; dump to disk on
#                          # .../snapshot (incident capture — nothing is written until triggered)
#   use_sim_time: false    # SITL/sim rigs: stamp messages from /clock

# Zenoh session tweaks (rmw_zenoh only; inert under other RMWs). Rendered into record.sh as one
# ZENOH_CONFIG_OVERRIDE export — rmw_zenoh applies the pairs ON TOP of the session config it loads
# (its shipped ROS default, or your ZENOH_SESSION_CONFIG_URI file), so untouched keys keep their
# ROS-tuned values; a bad key is a WARN in the recorder log and ignored, so check `logs` after
# changes. Shared memory ships DISABLED in rmw_zenoh and engages per link only where the PUBLISHER's
# session also opted in AND both containers share the host IPC namespace (the launcher adds the
# ipc:host overlay here automatically when SHM is effectively on; the PUBLISHER's container must set
# it itself) — anything unmet = silent TCP-loopback fallback, so verify by watching `lo` traffic
# collapse, not by the config. Keep every SHM participant on the
# same distro's zenoh (fleet-ros holds this by construction).
# zenoh:
#   shared_memory: true    # sugar for transport/shared_memory/enabled=true
#   shm_pool_mb: 8         # sugar for …/transport_optimization/pool_size — sizes the SHM pool for
#                          # what THIS session publishes (rmw default 48 MB): tiny suffices here,
#                          # the logger only publishes rosout/recorder events; the pool that matters
#                          # for pointclouds is the PUBLISHER's. Never set the ZENOH_SHM_ALLOC_SIZE
#                          # env instead — it aliases the same key and silently overrides this knob.
#                          # (No need to trim RMW_ZENOH_BUFFER_POOL_MAX_SIZE_BYTES for a subscriber-
#                          # only node either: that publish-path cap is lazy, not a reservation.)
#   overrides:             # any zenoh session-config subtree, flattened to leaf overrides and
#     transport:           # applied LAST (wins over the sugar above on conflict)
#       link: { rx: { buffer_size: 1048576 } }   # per-link read buffer (default 64 KiB): helps
#                          # sustained ingest of big topics arriving over TCP (one buffer per peer
#                          # link; topics riding SHM bypass this path entirely)

# Graph topology capture (the graph-snapshotter sidecar). Bags record data, not topology — no node
# identity, no subscribers, no services — so nothing says who talked to what during a run. Enabling
# this starts a second, profile-gated container beside the recorder that walks the live graph every
# interval_s and records per-node pubs/subs/service servers/clients as append-only, change-deduped
# EPOCH files at <run>/graph/<name>/epoch_<UTCstamp>.yaml (flat graph/<name> without a run
# registry — mirrors bags/). An unchanged graph bumps the open epoch's `last:` in place (the
# liveness signal); any change opens a new file; a restart always opens a new epoch. `rig graph` /
# `rig replay` consume the files and derive all views (union, instance grouping) at read time.
# ABSENT block = off; existing configs and deployments are unchanged.
graph:
  enabled: true
  interval_s: 60         # seconds between graph walks (a walk is 4 graph-API calls per node —
#                          # cheap; sub-minute intervals only sharpen epoch edges, not coverage)
#   settle_s: 2            # discovery warm-up before the first walk. Measured: the zenoh graph
#                          # cache is fully replayed by the time the node exists (the router
#                          # replays liveliness tokens during session open) — 2 s is pure margin
#                          # for a loaded router at boot
