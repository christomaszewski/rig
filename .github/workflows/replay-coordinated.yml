name: coordinated replay acceptance
on:
  workflow_dispatch:
    inputs:
      infra_ref:
        description: Full commit SHA of the compatible rig-infra source
        required: true
        type: string
      camera_ref:
        description: Full commit SHA of the compatible camera-service source
        required: true
        type: string
  workflow_call:
    inputs:
      infra_ref:
        required: true
        type: string
      camera_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Require immutable companion sources
        env:
          INFRA_REF: ${{ inputs.infra_ref }}
          CAMERA_REF: ${{ inputs.camera_ref }}
        run: |
          [[ "$INFRA_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set RIG_REPLAY_INFRA_REF to the tested companion commit'; exit 1; }
          [[ "$CAMERA_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set RIG_REPLAY_CAMERA_REF to the tested companion commit'; exit 1; }
      - uses: actions/checkout@v7
        with: {path: rig}
      - uses: actions/checkout@v7
        with:
          repository: christomaszewski/rig-infra
          ref: ${{ inputs.infra_ref }}
          path: infra
      - uses: actions/checkout@v7
        with:
          repository: christomaszewski/camera-service
          ref: ${{ inputs.camera_ref }}
          path: camera
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml build
      - name: Build production runtimes and install the Rig wheel
        run: |
          docker build -t local/fleet-ros:replay-ci infra/base
          docker build -f camera/core-driver/Dockerfile.dev -t local/cam-dev:replay-ci camera
          docker build -f camera/plugins/ros2-bridge/Dockerfile -t local/ros2-bridge:replay-ci camera
          cd rig
          python -m build
          python -m pip install --no-deps --target "$RUNNER_TEMP/rig-wheel" dist/*.whl
          docker builder prune --all --force
      - name: Baked entry point, automatic player and offline camera bundle
        working-directory: rig
        run: |
          for mode in registry offline; do
            python tests/replay_coordinated_smoke.py --package "$RUNNER_TEMP/rig-wheel" \
              --infra ../infra --image local/fleet-ros:replay-ci \
              --camera-service ../camera --camera-image local/cam-dev:replay-ci \
              --bridge-image local/ros2-bridge:replay-ci --bake "$mode" --auto-player
          done
      - name: Time-zero calls, fractional window and wall clock
        working-directory: rig
        run: |
          python tests/replay_coordinated_smoke.py --package "$RUNNER_TEMP/rig-wheel" \
            --infra ../infra --image local/fleet-ros:replay-ci --scripted-calls
          python tests/replay_coordinated_smoke.py --package "$RUNNER_TEMP/rig-wheel" \
            --infra ../infra --image local/fleet-ros:replay-ci --scripted-calls --wall-clock --rate 2 --window-from .5
      - name: Real startup failures and ownership conflicts
        working-directory: rig
        run: |
          for fault in timeout kill-held cancel concurrent; do
            python tests/replay_coordinated_smoke.py --package "$RUNNER_TEMP/rig-wheel" \
              --infra ../infra --image local/fleet-ros:replay-ci --fault "$fault"
          done
      - name: Keep bounded diagnostic evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/replay-evidence"
          python - <<'PY'
          import os, pathlib, shutil
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'replay-evidence'
          for root in pathlib.Path('/tmp').glob('rig-replay-coordinated-*'):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in ('.json', '.jsonl', '.stderr', '.stdout', '.yaml') and path.stat().st_size < 2_000_000:
                      target=destination/root.name/path.relative_to(root)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-replay-${{ matrix.runner }}
          path: ${{ runner.temp }}/replay-evidence
