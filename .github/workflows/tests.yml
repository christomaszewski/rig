name: tests
on:
  push: { branches: [main] }
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --user pyyaml
      # Plain-script tests, one file per module (no framework — see tests/*.py).
      - run: |
          rc=0
          for t in tests/test_*.py; do
            echo "── $t"
            python3 "$t" || rc=1
          done
          exit $rc
      # Live-service certify moved with the services to rig-infra's CI (ROADMAP §3e) — the sh-fixture
      # certify tests in tests/test_certify.py remain rig's own contract reference.
