# Release automation (plan M7): push a tag `vX.Y.Z` -> tests, wheel+sdist, arch=all deb,
# GitHub Release with all three as assets. The optional last step bumps the Homebrew tap
# (christomaszewski/homebrew-rig) and only runs when the TAP_PUSH_TOKEN secret is configured —
# without it the release still completes and the formula is bumped by hand.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}  # secrets aren't valid in step `if` — env is
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml build
      - name: tag must match rig_cli.__version__
        run: |
          v=$(python3 -c "import rig_cli; print(rig_cli.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - name: tests
        run: |
          rc=0
          for t in tests/test_*.py; do python3 "$t" || rc=1; done
          exit $rc
      - name: wheel + sdist
        run: python3 -m build
      - name: deb
        run: ./packaging/build-deb.sh
      - name: github release
        env: { GH_TOKEN: "${{ github.token }}" }
        # GitHub's release API 502s transiently (bit us on two consecutive releases) — retry with
        # backoff, and if an earlier attempt created the release but died mid-upload, fall through
        # to an idempotent asset (re)upload instead of failing on "already exists".
        run: |
          for i in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz build/deb/*.deb \
                --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" --title "rig $GITHUB_REF_NAME" \
                --generate-notes dist/*.whl dist/*.tar.gz build/deb/*.deb && exit 0
            fi
            echo "release attempt $i failed — retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          echo "release failed after 3 attempts" >&2
          exit 1
      - name: bump homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -e
          url="https://github.com/christomaszewski/rig/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/christomaszewski/homebrew-rig" tap
          # Surgical bump: ONLY the formula's own rig-archive url + the sha256 on the line right
          # after it. A blanket url substitution once clobbered the pyyaml resource's url too —
          # resources must stay untouched.
          python3 - "$url" "$sha" <<'EOF'
          import pathlib, re, sys
          url, sha = sys.argv[1], sys.argv[2]
          path = pathlib.Path("tap/Formula/rig-cli.rb")
          lines = path.read_text().splitlines()
          hit = [i for i, l in enumerate(lines)
                 if re.search(r'url "https://github\.com/christomaszewski/rig/archive/', l)]
          assert len(hit) == 1, f"expected exactly one rig-archive url line, found {len(hit)}"
          i = hit[0]
          lines[i] = re.sub(r'url "[^"]*"', f'url "{url}"', lines[i])
          assert 'sha256 "' in lines[i + 1], "sha256 must follow the url line"
          lines[i + 1] = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', lines[i + 1])
          path.write_text("\n".join(lines) + "\n")
          EOF
          cd tap
          git -c user.name=rig-release -c user.email=rig@localhost commit -am "rig ${GITHUB_REF_NAME#v}"
          git push -q
